        .date-selector {

        }
        .date-selector select {
            flex: 1; padding: 8px 12px; border: none; border-radius: 6px;

        .badge {

        }
        .badge-old { background: #ff6b6b; }
        
        #iframe-container { width: 100%; height: 100vh; padding-top: 60px; background: #fff; }

            position: fixed; top: 50%; transform: translateY(-50%);

        .nav-arrow:hover { background: rgba(0,0,0,0.7); width: 60px; }
        #nav-left { left: 0; border-radius: 0 8px 8px 0; }
        #nav-right { right: 0; border-radius: 8px 0 0 8px; }
        
        .country-info {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, transparent 100%);
            color: white; padding: 60px 20px 20px; text-align: center; z-index: 999;
            transition: opacity 0.3s ease;
        }
        .country-info.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .country-name { font-size: 22px; font-weight: 700; color: #4db8ff; }
        .file-info { font-size: 12px; color: #aaa; margin-top: 5px; }
        
        .file-panel {
            position: fixed;
            right: -350px;
            top: 60px;
            width: 350px;
            height: calc(100vh - 60px);
            background: rgba(255,255,255,0.98);
            overflow-y: scroll;
            overflow-x: hidden;
            z-index: 998;
            transition: right 0.3s;
            box-shadow: -4px 0 15px rgba(0,0,0,0.2);
        }
        .file-panel.open { right: 0; }

        .file-panel::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 6px; }

        .file-panel::-webkit-scrollbar-thumb:hover { background: #555; }
        
        .file-panel-header {

        .region {

            border-radius: 8px;
            overflow: hidden;
            background: #f8f9fa;
        }
        .region-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

            padding: 12px 16px;

            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            font-size: 14px;

        .region-header:hover {
            background: linear-gradient(135deg, #5568d3 0%, #653d8b 100%);
        }
        .region-header .arrow {
            transition: transform 0.3s;
            font-size: 12px;
        }
        .region-header.collapsed .arrow {
            transform: rotate(-90deg);
        }
        .region-content {
            max-height: 10000px;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }
        .region-content.collapsed {
            max-height: 0;
        }

        .file-item.active {

        .btn.active { background: rgba(255,255,255,0.4); border-color: rgba(255,255,255,0.6); }
        
        .panel-overlay {

        const countryName = document.getElementById('countryName');
        const fileInfo = document.getElementById('fileInfo');
        const fileList = document.getElementById('fileList');
        const filePanel = document.getElementById('filePanel');
        const panelOverlay = document.getElementById('panelOverlay');
        const countryInfo = document.getElementById('countryInfo');
        const counter = document.getElementById('counter');
        const dateSelect = document.getElementById('dateSelect');
        const dateBadge = document.getElementById('dateBadge');
        const mapModal = document.getElementById('mapModal');
        const mapTooltip = document.getElementById('mapTooltip');
        // ✅ 3. AQUÍ ES DONDE COLOCAS LA LÍNEA:
        // Insertar el mapa SVG en el contenedor apenas se cargan las variables
        document.getElementById('mapaContenedor').innerHTML = mapaSVG;

        function formatearFecha(fechaStr) {
            const anio = fechaStr.substring(0, 4);
            const mes = parseInt(fechaStr.substring(4, 6));
            const dia = parseInt(fechaStr.substring(6, 8));
            const meses = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
            return `${dia} de ${meses[mes - 1]}, ${anio}`;
        }

        function getFilePath(paisArchivo, fecha) {
            return `${fecha}/Diversidad sexual en ${paisArchivo} - Wikipedia, la enciclopedia libre ${fecha}.html`;
        }

        function loadFile(index, region = null) {
            let paisData;
            let regionName = region || currentRegion;
            
            if (region === null) {
                let globalIndex = 0;
                for (let reg in paisesPorRegion) {
                    for (let p of paisesPorRegion[reg]) {
                        if (globalIndex === index) {
                            paisData = p;
                            regionName = reg;
                            break;
                        }
                        globalIndex++;
                    }
                    if (paisData) break;
                }
            } else {
                paisData = paisesPorRegion[regionName][index];
            }
            
            if (!paisData) return;
            
            currentIndex = index;
            currentRegion = regionName;
            const filePath = getFilePath(paisData.archivo, fechaActual);
            
            viewer.src = filePath;
            countryName.textContent = `${paisData.nombre}`;
            fileInfo.textContent = `📁 Carpeta: ${fechaActual} |  ${regionName}`;
            
            document.querySelectorAll('.file-item').forEach((item, i) => {
                item.classList.toggle('active', i === index && item.dataset.region === regionName);
            });
            
            const activeItem = document.querySelector(`.file-item.active`);
            if (activeItem) activeItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            
            localStorage.setItem('lastIndex', index);
            localStorage.setItem('lastDate', fechaActual);
            localStorage.setItem('currentRegion', regionName);
        }

        function expandRegion(regionName) {
            const regions = document.querySelectorAll('.region');
            regions.forEach(r => {
                const header = r.querySelector('.region-header');
                const content = r.querySelector('.region-content');
                if (header.textContent.includes(regionName)) {
                    header.classList.remove('collapsed');
                    content.classList.remove('collapsed');
                }
            });
        }

        function initDateSelector() {
            dateSelect.innerHTML = '';
            fechasDisponibles.forEach((fecha) => {
                const option = document.createElement('option');
                option.value = fecha;
                option.textContent = formatearFecha(fecha);
                if (fecha === fechaActual) option.selected = true;
                dateSelect.appendChild(option);
            });
            
            if (fechaActual === fechasDisponibles[0]) {
                dateBadge.textContent = "ACTUAL";
                dateBadge.className = "badge";
            } else {
                dateBadge.textContent = "ARCHIVO";
                dateBadge.className = "badge badge-old";
            }
        }

        function initList() {
            fileList.innerHTML = '';
            let totalPaises = 0;
            
            for (let region in paisesPorRegion) {
                const paises = paisesPorRegion[region];
                totalPaises += paises.length;
                
                const regionDiv = document.createElement('div');
                regionDiv.className = 'region';
                
                const regionHeader = document.createElement('div');
                regionHeader.className = 'region-header';
                regionHeader.innerHTML = `
                    <span>${region} <span class="region-count">${paises.length}</span></span>
                    <span class="arrow">▼</span>
                `;
                
                const regionContent = document.createElement('div');
                regionContent.className = 'region-content';
                
                paises.forEach((pais, index) => {
                    const item = document.createElement('div');
                    item.className = 'file-item';
                    item.dataset.region = region;
                    item.dataset.index = index;
                    item.textContent = `${index + 1}. ${pais.nombre}`;
                    item.onclick = () => loadFile(index, region);
                    regionContent.appendChild(item);
                });
                
                regionHeader.onclick = () => {
                    regionHeader.classList.toggle('collapsed');
                    regionContent.classList.toggle('collapsed');
                };
                
                if (region !== currentRegion) {
                    regionHeader.classList.add('collapsed');
                    regionContent.classList.add('collapsed');
                }
                
                regionDiv.appendChild(regionHeader);
                regionDiv.appendChild(regionContent);
                fileList.appendChild(regionDiv);
            }
            
            counter.textContent = `${totalPaises} países`;
        }

        function togglePanel() {
            filePanel.classList.toggle('open');
            panelOverlay.classList.toggle('active');
            const isOpen = filePanel.classList.contains('open');
            document.getElementById('togglePanel').textContent = isOpen ? '✕ Cerrar' : ' Lista';
        }

        function closePanel() {
            filePanel.classList.remove('open');
            panelOverlay.classList.remove('active');
            document.getElementById('togglePanel').textContent = '📋 Lista';
        }

        function toggleInfo() {
            countryInfo.classList.toggle('hidden');
            const btn = document.getElementById('toggleInfoBtn');
            btn.classList.toggle('active');
            
            if (countryInfo.classList.contains('hidden')) {
                btn.textContent = '👁‍🗨';
                btn.title = 'Mostrar información inferior';
            } else {
                btn.textContent = '👁';
                btn.title = 'Ocultar información inferior';
            }
            
            localStorage.setItem('infoVisible', !countryInfo.classList.contains('hidden'));
        }

        // Funciones del Mapa
        function openMap() {
            mapModal.classList.add('open');
        }

        function closeMap() {
            mapModal.classList.remove('open');
        }

        function handleMapClick(e) {
            const target = e.target;
            const pais = target.dataset.pais;
            const region = target.dataset.region;
            
            if (pais && region) {
                // Buscar el país en la región
                const paises = paisesPorRegion[region];
                const index = paises.findIndex(p => p.nombre === pais || p.archivo === pais);
                
                if (index !== -1) {
                    currentRegion = region;
                    loadFile(index, region);
                    closeMap();
                    // Abrir el panel lateral para mostrar la región
                    if (!filePanel.classList.contains('open')) {
                        togglePanel();
                    }
                    expandRegion(region);
                }
            } else if (region && !pais) {
                // Es una región, expandirla en el panel
                currentRegion = region;
                closeMap();
                if (!filePanel.classList.contains('open')) {
                    togglePanel();
                }
                expandRegion(region);
            }
        }

        // Event listeners del mapa
        document.getElementById('mapBtn').onclick = openMap;
        document.getElementById('mapClose').onclick = closeMap;
        mapModal.onclick = (e) => {
            if (e.target === mapModal) closeMap();
        };

        // Tooltip del mapa
        document.querySelectorAll('.map-country, .map-region').forEach(el => {
            el.addEventListener('mouseenter', (e) => {
                const pais = el.dataset.pais;
                const region = el.dataset.region;
                let text = pais || `Región: ${region}`;
                mapTooltip.textContent = text;
                mapTooltip.style.display = 'block';
            });
            
            el.addEventListener('mousemove', (e) => {
                mapTooltip.style.left = e.clientX + 10 + 'px';
                mapTooltip.style.top = e.clientY + 10 + 'px';
            });
            
            el.addEventListener('mouseleave', () => {
                mapTooltip.style.display = 'none';
            });
            
            el.addEventListener('click', handleMapClick);
        });

        dateSelect.addEventListener('change', (e) => {
            fechaActual = e.target.value;
            e.target.blur();
            
            if (fechaActual === fechasDisponibles[0]) {
                dateBadge.textContent = "ACTUAL";
                dateBadge.className = "badge";
            } else {
                dateBadge.textContent = "ARCHIVO";
                dateBadge.className = "badge badge-old";
            }
            
            loadFile(currentIndex, currentRegion);
        });

        document.getElementById('nav-right').onclick = () => {
            const regions = Object.keys(paisesPorRegion);
            const currentRegIndex = regions.indexOf(currentRegion);
            const paises = paisesPorRegion[currentRegion];
            
            if (currentIndex + 1 < paises.length) {
                loadFile(currentIndex + 1, currentRegion);
            } else if (currentRegIndex < regions.length - 1) {
                loadFile(0, regions[currentRegIndex + 1]);
            } else {
                loadFile(0, regions[0]);
            }
        };

        document.getElementById('nav-left').onclick = () => {
            const regions = Object.keys(paisesPorRegion);
            const currentRegIndex = regions.indexOf(currentRegion);
            const paises = paisesPorRegion[currentRegion];
            
            if (currentIndex > 0) {
                loadFile(currentIndex - 1, currentRegion);
            } else if (currentRegIndex > 0) {
                const prevRegion = regions[currentRegIndex - 1];
                loadFile(paisesPorRegion[prevRegion].length - 1, prevRegion);
            } else {
                const lastRegion = regions[regions.length - 1];
                loadFile(paisesPorRegion[lastRegion].length - 1, lastRegion);
            }
        };
        
        document.getElementById('togglePanel').onclick = togglePanel;
        document.getElementById('closePanelBtn').onclick = closePanel;
        panelOverlay.onclick = closePanel;
        document.getElementById('toggleInfoBtn').onclick = toggleInfo;
        
        document.getElementById('fullscreenBtn').onclick = () => {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        };
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') {
                e.preventDefault();
                document.getElementById('nav-right').onclick();
            }
            if (e.key === 'ArrowLeft') {
                e.preventDefault();
                document.getElementById('nav-left').onclick();
            }
            if (e.key === 'Escape') {
                if (mapModal.classList.contains('open')) {
                    closeMap();
                } else {
                    closePanel();
                }
            }
            if (e.key === 'i' || e.key === 'I') toggleInfo();
            if (e.key === 'm' || e.key === 'M') {
                if (mapModal.classList.contains('open')) {
                    closeMap();
                } else {
                    openMap();
                }
            }
        });

        // Inicialización
        initDateSelector();
        initList();
        
        let globalIndex = 0;
        let loaded = false;
        for (let reg in paisesPorRegion) {
            for (let i = 0; i < paisesPorRegion[reg].length; i++) {
                if (globalIndex === currentIndex && reg === currentRegion) {
                    loadFile(i, reg);
                    loaded = true;
                    break;
                }
                globalIndex++;
            }
            if (loaded) break;
        }
        
        if (!loaded) loadFile(0, 'Norteamérica');
        
        const infoVisible = localStorage.getItem('infoVisible');
        if (infoVisible === 'false') {
            toggleInfo();
        }
    </script>
</body>
</html>
